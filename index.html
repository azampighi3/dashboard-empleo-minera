<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Búsqueda de Empleo — Alejandro Zampighi</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --alto:#22c55e; --medio:#eab308; --bajo:#64748b;
    --por-postular:#38bdf8; --postulado:#a78bfa; --entrevista:#22c55e; --rechazado:#ef4444; --oferta:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;padding:24px 20px;max-width:1100px;margin:0 auto}
  header{margin-bottom:20px}
  h1{font-size:1.4rem;margin-bottom:4px;font-weight:600}
  header p{color:var(--muted);font-size:.88rem}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;align-items:baseline;gap:8px;flex:1;min-width:120px}
  .stat .num{font-size:1.5rem;font-weight:700}
  .stat .lbl{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:none;color:var(--muted);font-size:.92rem;font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
  .tab:hover{color:var(--txt)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab .pill{background:var(--panel2);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:.72rem;margin-left:6px}
  .tab.active .pill{background:var(--accent);color:#04283b}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  input[type=search],select{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:8px;font-size:.88rem}
  input[type=search]{flex:1;min-width:200px}
  select{cursor:pointer}
  .count{color:var(--muted);font-size:.8rem;margin-bottom:10px}
  .list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:16px;padding:14px 18px;border-left:4px solid var(--line);background:var(--panel);border-bottom:1px solid var(--line);transition:background .12s}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--panel2)}
  .row.s-por-postular{border-left-color:var(--por-postular)}
  .row.s-postulado{border-left-color:var(--postulado)}
  .row.s-entrevista{border-left-color:var(--entrevista)}
  .row.s-rechazado{border-left-color:var(--rechazado)}
  .row.s-oferta{border-left-color:var(--oferta)}
  .main{flex:1;min-width:0}
  .main .cargo{font-weight:600;font-size:.98rem}
  .main .empresa{color:var(--accent);font-size:.85rem}
  .main .notas{color:var(--muted);font-size:.8rem;margin-top:2px}
  .meta{display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--muted);min-width:170px}
  .meta .cierre{color:#fbbf24}
  .badges{display:flex;flex-direction:column;gap:5px;align-items:flex-end;min-width:110px}
  .badge{font-size:.68rem;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
  .e-por-postular{background:rgba(56,189,248,.15);color:var(--por-postular)}
  .e-postulado{background:rgba(167,139,250,.15);color:var(--postulado)}
  .e-entrevista{background:rgba(34,197,94,.15);color:var(--entrevista)}
  .e-rechazado{background:rgba(239,68,68,.15);color:var(--rechazado)}
  .e-oferta{background:rgba(245,158,11,.15);color:var(--oferta)}
  .m-alto{background:rgba(34,197,94,.12);color:var(--alto)}
  .m-medio{background:rgba(234,179,8,.12);color:var(--medio)}
  .m-bajo{background:rgba(100,116,139,.18);color:var(--bajo)}
  .btn{background:var(--accent2);color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:.82rem;white-space:nowrap;transition:.12s}
  .btn:hover{background:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  footer{margin-top:20px;color:var(--muted);font-size:.76rem;text-align:center}
  @media(max-width:720px){
    .row{flex-wrap:wrap;gap:8px}
    .meta,.badges{flex-direction:row;flex-wrap:wrap;align-items:center;min-width:0}
    .badges{gap:8px}
    .btn{width:100%;text-align:center}
  }
</style>
</head>
<body>
<header>
  <h1>Dashboard de Búsqueda de Empleo</h1>
  <p>Ingeniería Civil Hidráulica · Minería y Gestión de Agua · Alejandro Zampighi</p>
</header>

<div class="stats" id="stats"></div>

<div class="tabs">
  <button class="tab active" data-tab="por-postular" id="tab1">Por postular <span class="pill" id="pill1">0</span></button>
  <button class="tab" data-tab="postuladas" id="tab2">Mis postulaciones <span class="pill" id="pill2">0</span></button>
</div>

<div class="controls">
  <input type="search" id="q" placeholder="Buscar empresa, cargo, ubicación…">
  <select id="fArea"><option value="">Todas las áreas</option></select>
  <select id="fEstado"><option value="">Todos los estados</option></select>
  <select id="fMatch"><option value="">Todo el match</option></select>
</div>

<div class="count" id="count"></div>
<div class="list" id="list"></div>

<footer>Datos desde <code>empleos.csv</code>. Actualiza ese archivo en GitHub para refrescar el dashboard.</footer>

<script>
let DATA=[], TAB='por-postular';
const $=s=>document.querySelector(s);

function parseCSV(t){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){cur+='"';i++} else q=false } else cur+=c }
    else{ if(c=='"')q=true; else if(c==','){row.push(cur);cur=''} else if(c=='\n'||c=='\r'){ if(cur!==''||row.length){row.push(cur);rows.push(row);row=[];cur=''} } else cur+=c }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  const h=rows.shift();
  return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),(r[i]||'').trim()])));
}

const slug=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'-');
const esStgo=d=>/santiago/i.test(d.ubicacion)?0:1;
const rankMatch={Alto:0,Medio:1,Bajo:2};

// Orden: Santiago primero, luego más recientes, luego mayor match
function ordenar(list){
  return list.sort((a,b)=>{
    if(esStgo(a)!==esStgo(b)) return esStgo(a)-esStgo(b);
    if(a.fecha_publicacion!==b.fecha_publicacion) return (b.fecha_publicacion||'').localeCompare(a.fecha_publicacion||'');
    return (rankMatch[a.match]??9)-(rankMatch[b.match]??9);
  });
}

function enTab(d){ return TAB=='por-postular' ? d.estado=='Por postular' : d.estado!='Por postular'; }

function render(){
  const q=$('#q').value.toLowerCase();
  const fe=$('#fEstado').value, fa=$('#fArea').value, fm=$('#fMatch').value;
  let list=DATA.filter(d=>enTab(d)).filter(d=>{
    const hay=(d.empresa+d.cargo+d.ubicacion+d.notas).toLowerCase().includes(q);
    return hay && (!fe||d.estado==fe) && (!fa||d.area==fa) && (!fm||d.match==fm);
  });
  list=ordenar(list);
  const totalTab=DATA.filter(enTab).length;
  $('#count').textContent = list.length+' de '+totalTab+' empleos';
  $('#list').innerHTML = list.length? list.map(d=>`
    <div class="row s-${slug(d.estado)}">
      <div class="main">
        <div class="cargo">${d.cargo}</div>
        <div class="empresa">${d.empresa}</div>
        ${d.notas?`<div class="notas">${d.notas}</div>`:''}
      </div>
      <div class="meta">
        <span>📍 ${d.ubicacion}</span>
        <span>🏷️ ${d.area}</span>
        <span>🗓️ Publicado: ${d.fecha_publicacion||'—'}</span>
        ${d.fecha_cierre?`<span class="cierre">⏳ Cierra: ${d.fecha_cierre}</span>`:''}
      </div>
      <div class="badges">
        <span class="badge e-${slug(d.estado)}">${d.estado}</span>
        <span class="badge m-${slug(d.match)}">Match ${d.match}</span>
      </div>
      <a class="btn" href="${d.link}" target="_blank" rel="noopener">Postular →</a>
    </div>`).join('') : '<div class="empty">No hay empleos que coincidan con el filtro.</div>';
}

function stats(){
  const by=k=>DATA.filter(d=>d.estado==k).length;
  const cards=[
    ['Total',DATA.length],['Por postular',by('Por postular')],
    ['Postulado',by('Postulado')],['Entrevista',by('Entrevista')],
    ['Match alto',DATA.filter(d=>d.match=='Alto').length]
  ];
  $('#stats').innerHTML=cards.map(([l,n])=>`<div class="stat"><span class="num">${n}</span><span class="lbl">${l}</span></div>`).join('');
  $('#pill1').textContent=DATA.filter(d=>d.estado=='Por postular').length;
  $('#pill2').textContent=DATA.filter(d=>d.estado!='Por postular').length;
}

function fillSelect(id,key){
  const vals=[...new Set(DATA.map(d=>d[key]))].filter(Boolean).sort();
  $(id).insertAdjacentHTML('beforeend',vals.map(v=>`<option>${v}</option>`).join(''));
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  TAB=t.dataset.tab;
  render();
}));

fetch('empleos.csv?t='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
  DATA=parseCSV(t);
  stats();
  fillSelect('#fArea','area');fillSelect('#fEstado','estado');fillSelect('#fMatch','match');
  render();
  ['#q','#fEstado','#fArea','#fMatch'].forEach(s=>$(s).addEventListener('input',render));
}).catch(e=>{$('#list').innerHTML='<div class="empty">No se pudo cargar empleos.csv. Abre esta página en GitHub Pages (abrir el HTML directo desde el disco bloquea la carga del CSV).</div>'});
</script>
</body>
</html>
